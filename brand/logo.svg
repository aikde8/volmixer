<?xml version="1.0" encoding="UTF-8"?>
<!-- AiKDE rosette mark. Seventeen dots on a 100-unit field, four radial shells, open ring at the centre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="AiKDE" width="100" height="100">
  <!-- outer corner dots -->
  <circle cx="25" cy="25" r="2.6" fill="#8CBCF8"/>
  <circle cx="75" cy="25" r="2.6" fill="#8CBCF8"/>
  <circle cx="25" cy="75" r="2.6" fill="#8CBCF8"/>
  <circle cx="75" cy="75" r="2.6" fill="#8CBCF8"/>
  <!-- outer ortho -->
  <circle cx="50" cy="18" r="3.4" fill="#6AA8F5"/>
  <circle cx="82" cy="50" r="3.4" fill="#6AA8F5"/>
  <circle cx="50" cy="82" r="3.4" fill="#6AA8F5"/>
  <circle cx="18" cy="50" r="3.4" fill="#6AA8F5"/>
  <!-- inner diagonal -->
  <circle cx="37" cy="37" r="5.4" fill="#3C85F0"/>
  <circle cx="63" cy="37" r="5.4" fill="#3C85F0"/>
  <circle cx="37" cy="63" r="5.4" fill="#4A95F2"/>
  <circle cx="63" cy="63" r="5.4" fill="#4A95F2"/>
  <!-- inner ortho -->
  <circle cx="50" cy="33" r="6"   fill="#1E63EB"/>
  <circle cx="67" cy="50" r="6"   fill="#2170EC"/>
  <circle cx="50" cy="67" r="6"   fill="#2E78EE"/>
  <circle cx="33" cy="50" r="6"   fill="#2170EC"/>
  <!-- centre ring (the open node) -->
  <circle cx="50" cy="50" r="5.2" fill="none" stroke="#B9D4F8" stroke-width="1.9"/>
</svg>
