<?xml version="1.0" encoding="UTF-8"?>
<!-- AiKDE horizontal lockup: rosette icon + wordmark. Text is drawn, not referenced, so no font files are needed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="AiKDE" width="420" height="120">
  <defs>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E63EB"/>
      <stop offset="100%" stop-color="#4A95F2"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <g transform="translate(10,10)">
    <circle cx="25" cy="25" r="2.6" fill="#8CBCF8"/>
    <circle cx="75" cy="25" r="2.6" fill="#8CBCF8"/>
    <circle cx="25" cy="75" r="2.6" fill="#8CBCF8"/>
    <circle cx="75" cy="75" r="2.6" fill="#8CBCF8"/>
    <circle cx="50" cy="18" r="3.4" fill="#6AA8F5"/>
    <circle cx="82" cy="50" r="3.4" fill="#6AA8F5"/>
    <circle cx="50" cy="82" r="3.4" fill="#6AA8F5"/>
    <circle cx="18" cy="50" r="3.4" fill="#6AA8F5"/>
    <circle cx="37" cy="37" r="5.4" fill="#3C85F0"/>
    <circle cx="63" cy="37" r="5.4" fill="#3C85F0"/>
    <circle cx="37" cy="63" r="5.4" fill="#4A95F2"/>
    <circle cx="63" cy="63" r="5.4" fill="#4A95F2"/>
    <circle cx="50" cy="33" r="6"   fill="#1E63EB"/>
    <circle cx="67" cy="50" r="6"   fill="#2170EC"/>
    <circle cx="50" cy="67" r="6"   fill="#2E78EE"/>
    <circle cx="33" cy="50" r="6"   fill="#2170EC"/>
    <circle cx="50" cy="50" r="5.2" fill="none" stroke="#B9D4F8" stroke-width="1.9"/>
  </g>
  <!-- Wordmark. Needs the Plus Jakarta Sans font locally; otherwise it falls back to the stack. -->
  <text x="130" y="80"
        font-family="'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif"
        font-weight="800" font-size="64" letter-spacing="-1.5">
    <tspan fill="url(#aiGrad)">Ai</tspan><tspan fill="#082454">KDE</tspan>
  </text>
</svg>
